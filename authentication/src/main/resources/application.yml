spring:
  application:
    name: authentication
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ecommerce}
    username: ${DB_USERNAME:ecommerce}
    password: ${DB_PASSWORD:ecommerce}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
security:
  jwt:
    secret: ${JWT_SECRET:change-me-to-at-least-32-characters-secret-key}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
springdoc:
  api-docs:
    path: /v3/api-docs
